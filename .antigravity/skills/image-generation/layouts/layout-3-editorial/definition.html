<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HVS - Layout 3 Editorial — Definition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#311B92; --accent:#00E5FF; --dark:#0A0A12; }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',Arial,sans-serif;}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#050508;}

        .template-container{width:1000px;height:562px;overflow:hidden;position:relative;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,0.08);box-shadow:0 40px 100px rgba(0,0,0,0.9);}

        /* TOP: Photo strip 52% */
        .photo-strip{position:relative;height:52%;overflow:hidden;flex-shrink:0;}
        /* CỔNG CHỜ: thay src bằng ảnh abstract concept liên quan thuật ngữ */
        .photo-strip img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block;}
        .photo-strip::after{content:'';position:absolute;bottom:0;left:0;right:0;height:70%;background:linear-gradient(to bottom,transparent,rgba(10,10,18,0.85) 65%,var(--dark) 100%);}

        .photo-header{position:absolute;top:0;left:0;right:0;padding:22px 36px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(to bottom,rgba(8,8,16,0.75),transparent);}
        .brand-logo{display:flex;align-items:center;gap:9px;}
        .brand-logo img{height:24px;width:24px;object-fit:contain;}
        .brand-name{font-size:11px;font-weight:800;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1.5px;}
        /* CỔNG CHỜ: badge danh mục */
        .category-badge{font-size:11px;font-weight:800;color:var(--accent);background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.28);padding:5px 13px;border-radius:100px;text-transform:uppercase;letter-spacing:0.5px;}

        .title-overlay{position:absolute;bottom:18px;left:36px;right:36px;z-index:10;}
        /* CỔNG CHỜ: nhãn ngữ cảnh */
        .def-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.38);text-transform:uppercase;letter-spacing:2px;margin-bottom:7px;}
        /* CỔNG CHỜ: tên thuật ngữ — dùng .ac cho từ nhấn mạnh */
        .def-title{font-size:62px;font-weight:900;line-height:0.95;letter-spacing:-3px;color:#FFF;}
        .def-title .ac{color:var(--accent);text-shadow:0 0 45px rgba(0,229,255,0.7);}

        /* BOTTOM: Data bar */
        .data-bar{flex-grow:1;background:var(--dark);padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,0.06);position:relative;}
        .data-bar::before{content:'';position:absolute;top:-1px;left:36px;width:80px;height:2px;background:linear-gradient(to right,var(--accent),transparent);}

        .def-summary-block{flex:1.6;max-width:340px;}
        /* CỔNG CHỜ: câu định nghĩa 1-2 dòng */
        .def-summary{font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.58);line-height:1.65;border-left:2px solid var(--accent);padding-left:12px;}

        .vdivider{width:1px;height:54px;background:rgba(255,255,255,0.07);flex-shrink:0;}

        .facts-strip{display:flex;flex:2;gap:0;}
        .fact-col{flex:1;text-align:center;padding:0 16px;border-right:1px solid rgba(255,255,255,0.06);}
        .fact-col:last-child{border-right:none;}
        /* CỔNG CHỜ: nhãn fact */
        .fact-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
        /* CỔNG CHỜ: giá trị fact — dùng .cyan cho giá trị nổi bật */
        .fact-value{font-size:19px;font-weight:900;color:#FFF;letter-spacing:-0.5px;line-height:1;}
        .fact-value.cyan{color:var(--accent);text-shadow:0 0 15px rgba(0,229,255,0.35);}
        .fact-sub{font-size:10px;color:rgba(255,255,255,0.25);margin-top:4px;}

        .footer-brand{flex-shrink:0;text-align:right;}
        .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);display:inline-block;margin-right:6px;}
        /* CỔNG CHỜ: chủ đề bài viết */
        .footer-text{font-size:10px;font-weight:700;color:rgba(255,255,255,0.18);text-transform:uppercase;letter-spacing:1px;}
    </style>
</head>
<body>
    <div class="template-container">

        <!-- TOP: Photo Strip -->
        <div class="photo-strip">
            <!-- CỔNG CHỜ: ảnh nền abstract concept -->
            <img src="../../assets/bg-texture.png" alt="Concept">

            <div class="photo-header">
                <div class="brand-logo">
                    <img src="../../assets/favicon.ico" alt="HVS Logo">
                    <span class="brand-name">HVS Tài Chính Số</span>
                </div>
                <!-- CỔNG CHỜ: danh mục bài viết -->
                <span class="category-badge">Thuật ngữ tài chính</span>
            </div>

            <div class="title-overlay">
                <!-- CỔNG CHỜ: nhãn ngữ cảnh -->
                <div class="def-label">Định nghĩa · Phân tích cơ bản</div>
                <!-- CỔNG CHỜ: tên thuật ngữ — dùng .ac cho từ nhấn mạnh -->
                <div class="def-title">EPS <span class="ac">là</span> gì?</div>
            </div>
        </div>

        <!-- BOTTOM: Data Bar -->
        <div class="data-bar">

            <div class="def-summary-block">
                <!-- CỔNG CHỜ: câu định nghĩa 1-2 dòng -->
                <p class="def-summary">Lợi nhuận trên mỗi cổ phiếu — thước đo sinh lời cơ bản nhất khi định giá cổ phiếu.</p>
            </div>

            <div class="vdivider"></div>

            <!-- CỔNG CHỜ: 3 fact liên quan thuật ngữ -->
            <div class="facts-strip">
                <div class="fact-col">
                    <div class="fact-label">Công thức</div>
                    <div class="fact-value cyan" style="font-size:14px;">LN ÷ CP</div>
                    <div class="fact-sub">Lợi nhuận ròng</div>
                </div>
                <div class="fact-col">
                    <div class="fact-label">Ngưỡng tốt</div>
                    <div class="fact-value cyan">&gt;2.000đ</div>
                    <div class="fact-sub">EPS / CP</div>
                </div>
                <div class="fact-col">
                    <div class="fact-label">Liên quan</div>
                    <div class="fact-value" style="font-size:16px;">P/E · P/B</div>
                    <div class="fact-sub">Định giá CP</div>
                </div>
            </div>

            <div class="vdivider"></div>

            <div class="footer-brand">
                <div class="dot"></div>
                <!-- CỔNG CHỜ: chủ đề bài viết -->
                <span class="footer-text">Kiến thức đầu tư · hvs.vn</span>
            </div>

        </div>

    </div>
</body>
</html>
