<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HVS - Layout 3 Editorial — Definition (Light)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#311B92; --secondary:#00838F; --bg-light:#FAF6F0; --text-dark:#1E1C24; }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',Arial,sans-serif;}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#121212;}
        .template-container{width:1000px;height:562px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,0.6);}
        .photo-strip{position:relative;height:50%;overflow:hidden;flex-shrink:0;}
        /* CỔNG CHỜ: ảnh nền abstract concept */
        .photo-strip img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block;}
        .photo-strip::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(to bottom,transparent,rgba(250,246,240,0.75) 60%,var(--bg-light) 100%);}
        .top-accent{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(to right,var(--primary),var(--secondary),transparent);z-index:10;}
        .photo-header{position:absolute;top:0;left:0;right:0;padding:20px 36px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
        .brand-logo{display:flex;align-items:center;gap:9px;}
        .brand-logo img{height:24px;width:24px;object-fit:contain;}
        .brand-name{font-size:13px;font-weight:800;color:#FFF;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
        /* CỔNG CHỜ: badge danh mục */
        .category-badge{font-size:11px;font-weight:800;color:#FFF;background:rgba(49,27,146,0.75);border:1px solid rgba(255,255,255,0.25);padding:5px 13px;border-radius:100px;text-transform:uppercase;letter-spacing:0.5px;backdrop-filter:blur(8px);}
        .title-overlay{position:absolute;bottom:14px;left:36px;right:36px;z-index:10;}
        /* CỔNG CHỜ: nhãn ngữ cảnh */
        .def-label{font-size:10px;font-weight:700;color:rgba(49,27,146,0.6);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
        /* CỔNG CHỜ: tên thuật ngữ */
        .def-title{font-size:62px;font-weight:900;line-height:0.95;letter-spacing:-3px;color:var(--text-dark);}
        .def-title .ac{color:var(--primary);}
        .data-bar{flex-grow:1;background:var(--bg-light);padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:2px solid rgba(49,27,146,0.1);position:relative;}
        .data-bar::before{content:'';position:absolute;top:-2px;left:36px;width:80px;height:2px;background:var(--primary);}
        .def-summary-block{flex:1.6;max-width:330px;}
        /* CỔNG CHỜ: câu định nghĩa */
        .def-summary{font-size:13px;font-weight:600;color:rgba(30,28,36,0.65);line-height:1.65;border-left:3px solid var(--primary);padding-left:12px;}
        .vdivider{width:1px;height:52px;background:rgba(49,27,146,0.1);flex-shrink:0;}
        .facts-strip{display:flex;flex:2;gap:0;}
        .fact-col{flex:1;text-align:center;padding:0 16px;border-right:1px solid rgba(49,27,146,0.08);}
        .fact-col:last-child{border-right:none;}
        /* CỔNG CHỜ: nhãn fact */
        .fact-label{font-size:10px;font-weight:700;color:rgba(49,27,146,0.4);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
        /* CỔNG CHỜ: giá trị fact — dùng .primary cho giá trị nổi bật */
        .fact-value{font-size:19px;font-weight:900;color:var(--text-dark);letter-spacing:-0.5px;line-height:1;}
        .fact-value.primary{color:var(--primary);}
        .fact-sub{font-size:10px;color:rgba(30,28,36,0.35);margin-top:4px;}
        .footer-brand{flex-shrink:0;text-align:right;}
        .footer-tag{font-size:10px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:1px;}
    </style>
</head>
<body>
    <div class="template-container">
        <div class="photo-strip">
            <!-- CỔNG CHỜ: ảnh nền abstract concept -->
            <img src="../../assets/bg-texture.png" alt="Concept">
            <div class="top-accent"></div>
            <div class="photo-header">
                <div class="brand-logo">
                    <img src="../../assets/favicon.ico" alt="HVS Logo">
                    <span class="brand-name">HVS Tài Chính Số</span>
                </div>
                <!-- CỔNG CHỜ: danh mục bài viết -->
                <span class="category-badge">Thuật ngữ tài chính</span>
            </div>
            <div class="title-overlay">
                <!-- CỔNG CHỜ: nhãn ngữ cảnh -->
                <div class="def-label">Định nghĩa · Phân tích cơ bản</div>
                <!-- CỔNG CHỜ: tên thuật ngữ — dùng .ac cho từ nhấn mạnh -->
                <div class="def-title">EPS <span class="ac">là</span> gì?</div>
            </div>
        </div>
        <div class="data-bar">
            <div class="def-summary-block">
                <!-- CỔNG CHỜ: câu định nghĩa -->
                <p class="def-summary">Lợi nhuận trên mỗi cổ phiếu — thước đo sinh lời cơ bản nhất khi định giá cổ phiếu.</p>
            </div>
            <div class="vdivider"></div>
            <!-- CỔNG CHỜ: 3 fact liên quan thuật ngữ -->
            <div class="facts-strip">
                <div class="fact-col">
                    <div class="fact-label">Công thức</div>
                    <div class="fact-value primary" style="font-size:14px;">LN ÷ CP</div>
                    <div class="fact-sub">Lợi nhuận ròng</div>
                </div>
                <div class="fact-col">
                    <div class="fact-label">Ngưỡng tốt</div>
                    <div class="fact-value primary">&gt;2.000đ</div>
                    <div class="fact-sub">EPS / CP</div>
                </div>
                <div class="fact-col">
                    <div class="fact-label">Liên quan</div>
                    <div class="fact-value" style="font-size:16px;">P/E · P/B</div>
                    <div class="fact-sub">Định giá CP</div>
                </div>
            </div>
            <div class="vdivider"></div>
            <div class="footer-brand">
                <span class="footer-tag">HVS Tài Chính Số</span>
            </div>
        </div>
    </div>
</body>
</html>
